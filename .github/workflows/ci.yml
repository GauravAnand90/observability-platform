name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROM_IMAGE: prom/prometheus:v3.5.0
  AM_IMAGE: prom/alertmanager:v0.28.1
  OTELCOL_IMAGE: otel/opentelemetry-collector-contrib:0.163.1

jobs:
  go:
    name: go vet / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go mod tidy
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && echo "run gofmt" && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -o /dev/null .

  slo-rules:
    name: SLO rules (generated, valid, unit-tested)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: recording rules match the generator
        run: |
          pip install --quiet pyyaml
          python3 scripts/gen_slo_rules.py
          git diff --exit-code prometheus/rules/ || (echo "::error::slo-recording.yml is stale. Run 'make rules' and commit." && exit 1)
      - name: promtool check rules
        run: docker run --rm -v "$PWD/prometheus:/p:ro" -w /p --entrypoint promtool "$PROM_IMAGE" check rules rules/slo-recording.yml rules/slo-alerts.yml
      - name: promtool test rules
        run: docker run --rm -v "$PWD/prometheus:/p:ro" -w /p --entrypoint promtool "$PROM_IMAGE" test rules tests/slo-alerts.test.yml

  configs:
    name: configs (Prometheus, Alertmanager, Collector, Grafana, compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check config
        run: docker run --rm -v "$PWD/prometheus:/p:ro" -w /p --entrypoint promtool "$PROM_IMAGE" check config prometheus.yml
      - name: amtool check-config
        run: docker run --rm -v "$PWD/alertmanager:/a:ro" --entrypoint amtool "$AM_IMAGE" check-config /a/alertmanager.yml
      - name: otelcol validate
        run: docker run --rm -v "$PWD/otel-collector:/c:ro" "$OTELCOL_IMAGE" validate --config=/c/config.yaml
      - name: dashboards are valid JSON with unique uids
        run: |
          for f in grafana/dashboards/*.json; do jq -e '.uid and .title' "$f" >/dev/null || { echo "::error file=$f::invalid dashboard"; exit 1; }; done
          dupes=$(jq -r '.uid' grafana/dashboards/*.json | sort | uniq -d)
          [ -z "$dupes" ] || { echo "::error::duplicate dashboard uids: $dupes"; exit 1; }
      - name: docker compose config
        run: docker compose config -q
