# GENERATED by scripts/gen_slo_rules.py. Edit the SLO definitions there, then run `make rules`.
#
# SLI error ratios recorded per SLO over every window the burn-rate alerts use.
# Naming follows level:metric:operations; every series carries {service, slo}
# so the alerts and dashboards in this repo work unchanged for any new SLO.
#
#   checkout-availability: 99.9% of checkout requests succeed (non-5xx) over 30 days
#   checkout-latency: 99% of checkout requests complete within 300ms over 30 days

groups:
- name: slo-checkout-availability-sli
  interval: 1m
  rules:
  - record: slo:objective:ratio
    expr: vector(0.999)
    labels:
      service: checkout-api
      slo: checkout-availability
  - record: slo:error_budget:ratio
    expr: vector(0.001)
    labels:
      service: checkout-api
      slo: checkout-availability
  - record: slo:sli_error:ratio_rate5m
    expr: |
      (
        sum(rate(http_requests_total{service="checkout-api",route="/api/checkout",code=~"5.."}[5m]))
        or vector(0)
      )
      /
      sum(rate(http_requests_total{service="checkout-api",route="/api/checkout"}[5m]))
    labels:
      service: checkout-api
      slo: checkout-availability
  - record: slo:sli_error:ratio_rate30m
    expr: |
      (
        sum(rate(http_requests_total{service="checkout-api",route="/api/checkout",code=~"5.."}[30m]))
