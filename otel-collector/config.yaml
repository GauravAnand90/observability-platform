# OpenTelemetry Collector: the single entry point for telemetry.
# Apps only know "send OTLP to the Collector"; where it goes, how it's sampled
# and what metrics are derived from it are decided here, not in app code.
#
#   app/loadgen --OTLP--> receiver --> traces (tail-sampled)  --> Tempo
#                                  \-> spanmetrics + servicegraph --> Prometheus (:8889)

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # First in every pipeline: refuse data before the Collector itself OOMs.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25

  resource:
    attributes:
      - key: deployment.environment.name
        value: local
        action: upsert

  # Decide per whole trace, after it completes: keep every error and every slow
  # trace, plus 10% of the rest. Head sampling in the SDK can't do this because
  # it decides before it knows how the request ends.
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    policies:
      - name: keep-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: keep-slow
        type: latency
        latency:
          threshold_ms: 300
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

  batch:
    send_batch_size: 1024
    timeout: 5s

connectors:
  # RED metrics computed from 100% of spans (before sampling), so they stay
  # accurate even though only a fraction of traces is stored.
  spanmetrics:
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 200ms, 300ms, 500ms, 1s, 2.5s, 5s]
    metrics_flush_interval: 15s

  # Request/error/latency per edge between services; powers Grafana's service map.
  servicegraph:
    latency_histogram_buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 200ms, 300ms, 500ms, 1s, 2.5s, 5s]
    store:
      ttl: 10s
      max_items: 10000

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8889

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, tail_sampling, batch]
      exporters: [otlp/tempo]
    traces/derive-metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [spanmetrics, servicegraph]
    metrics/derived:
      receivers: [spanmetrics, servicegraph]
      processors: [batch]
      exporters: [prometheus]
