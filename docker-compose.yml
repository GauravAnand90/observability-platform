# Full stack on a laptop: `make up`, then open http://localhost:3000
#
#   loadgen ──HTTP──▶ checkout-api ──/metrics──▶ Prometheus ──alerts──▶ Alertmanager ──▶ alert-sink
#      │                   │                          ▲
#      └──────OTLP─────────┴──▶ OTel Collector ──────┘ (spanmetrics, servicegraph)
#                                     │
#                                     └──traces (tail-sampled)──▶ Tempo ──▶ Grafana

name: observability-platform

x-app: &app
  build:
    context: ./app
  image: observability-platform-app:local
  restart: unless-stopped
  read_only: true
  security_opt: [no-new-privileges:true]

services:
  app:
    <<: *app
    command: ["-mode=server", "-listen=:8080", "-service=checkout-api"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=shop
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "/app", "-mode=probe", "-target=http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on: [otel-collector]

  loadgen:
    <<: *app
    command: ["-mode=loadgen", "-target=http://app:8080", "-rps=20"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=shop
    depends_on:
      app:
        condition: service_healthy

  alert-sink:
    <<: *app
    command: ["-mode=alertsink", "-listen=:9095"]
    ports: ["9095:9095"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (for anything else you want to trace locally)
      - "4318:4318"   # OTLP HTTP
      - "13133:13133" # health check
    restart: unless-stopped
    depends_on: [tempo]

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    # Local-only: runs as root so it can write the named volume Docker creates as root.
    user: "0:0"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports: ["3200:3200"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=35d # > 30d so the 30-day SLO window always has data
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports: ["9093:9093"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true" # lets anonymous viewers open traces in Explore (local demo only)
      GF_SECURITY_ADMIN_PASSWORD: admin # local demo only
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/slo-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    restart: unless-stopped
    depends_on: [prometheus, tempo]

volumes:
  prometheus-data:
  alertmanager-data:
  tempo-data:
  grafana-data:
